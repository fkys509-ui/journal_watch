name: journal-watch

on:
  schedule:
    # UTC 00:00 = Beijing 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      query_mode:
        description: "Query mode: manual or builder"
        required: false
        default: ""
      query_manual:
        description: "Manual PubMed query"
        required: false
        default: ""
      query_builder:
        description: "Builder-generated query"
        required: false
        default: ""
      lookback_hours:
        description: "Lookback window in hours"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || vars.LOOKBACK_HOURS || '72' }}
          MAX_PER_JOURNAL: "20"
          REPORT_MODE: ${{ vars.REPORT_MODE || 'monitor' }}
          QUERY_MODE: ${{ github.event.inputs.query_mode || vars.QUERY_MODE || '' }}
          QUERY_MANUAL: ${{ github.event.inputs.query_manual || vars.QUERY_MANUAL || '' }}
          QUERY_BUILDER: ${{ github.event.inputs.query_builder || vars.QUERY_BUILDER || '' }}
        run: |
          python monitor.py

      - name: Commit report and state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update journal watch report"
            git push
          fi

      - name: Build GitHub Pages site
        run: |
          python build_pages.py

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
