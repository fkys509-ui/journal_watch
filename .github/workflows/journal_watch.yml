name: journal-watch

on:
  schedule:
    # UTC 00:00 = Beijing 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          LOOKBACK_HOURS: "72"
          MAX_PER_JOURNAL: "20"
          REPORT_MODE: ${{ vars.REPORT_MODE || 'monitor' }}
        run: |
          python monitor.py

      - name: Commit report and state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update journal watch report"
            git push
          fi

      - name: Build GitHub Pages site
        run: |
          python build_pages.py

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf .gh-pages
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .gh-pages
          cd .gh-pages

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          rm -rf ./*
          cp -r ../site/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish on gh-pages."
          else
            git commit -m "docs: update github pages site"
            git push origin gh-pages --force
          fi
