name: journal-watch

on:
  workflow_dispatch:
    inputs:
      query_builder:
        description: "Title-only keyword query"
        required: false
        default: ""
      date_from:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MAX_PER_JOURNAL: "20"
          REPORT_MODE: ${{ vars.REPORT_MODE || 'monitor' }}
          QUERY_BUILDER: ${{ github.event.inputs.query_builder || vars.QUERY_BUILDER || '' }}
          DATE_FROM: ${{ github.event.inputs.date_from || '' }}
          DATE_TO: ${{ github.event.inputs.date_to || '' }}
        run: |
          python monitor.py

      - name: Commit report and state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update journal watch report"
            git push
          fi

      - name: Build GitHub Pages site
        run: |
          python build_pages.py

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
